# CI：代码质量门禁
# 每次 push / PR 自动执行：安装依赖 -> 类型检查 -> 单元测试 -> 生产构建
# 依赖安装走 pnpm store 缓存，命中时整个流水线 ~1 分钟

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & Test & Build
    runs-on: ubuntu-latest

    # 🚀 新增：把远程缓存凭证注入环境变量
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Turborepo 本地缓存命中日志，方便观察缓存效果
      - name: Turbo cache summary
        run: pnpm exec turbo run build --dry=json | grep -E '"cache"|"hits"' || true
