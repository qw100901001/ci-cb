# 微前端同域部署配置：
#   /         -> 主应用（基座）
#   /sub-react/、/sub-vue/ -> 两个子应用的静态资源
# 同域部署下 qiankun fetch 子应用 entry 不存在跨域问题（生产环境推荐做法）

server {
    listen 80;
    server_name localhost;

    # 静态资源 gzip，提升子应用加载速度
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # 主应用
    location / {
        try_files $uri $uri/ /index.html;
    }

    # React 子应用（注意结尾斜杠：/sub-react 会 301 到 /sub-react/，保持 entry 与主应用注册一致）
    location /sub-react/ {
        try_files $uri $uri/ /sub-react/index.html;
    }

    # Vue 子应用
    location /sub-vue/ {
        try_files $uri $uri/ /sub-vue/index.html;
    }

    # 静态资源缓存（带 hash 的 assets 可长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
